[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roomreserve"
version = "1.0.0"
description = "Practice-room reservation system for the Western Music Department, Faculty of Fine and Applied Arts, Chulalongkorn University."
requires-python = ">=3.12"

[tool.setuptools]
packages = ["roomreserve", "core"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "roomreserve.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "concurrency: tests that use independent PostgreSQL connections and synchronization barriers",
    "browser: real-browser end-to-end tests driven by Playwright",
    "slow: long-running stress tests",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["core/migrations", ".venv", "staticfiles", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ", "SIM", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter
    "RUF012",  # Django Meta lists are intentionally mutable class attributes
    # En dashes are deliberate in the bilingual user-facing copy (for example
    # "08:00-20:00" and numeric ranges), not ambiguous homoglyphs.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001"]
"core/settings/*" = ["F405", "F403"]
